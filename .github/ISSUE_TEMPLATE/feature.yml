name: Feature request
description: Suggest a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the plugin makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you imagine it working. Mention the surfaces involved (sessions, workspaces, super agent, streams, SSH).
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "app 0.2.2-rc.3 / plugin 1.12.0"
